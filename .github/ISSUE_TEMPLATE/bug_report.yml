name: 🐛 Bug Report
description: Report a reproducible issue or unexpected behavior in NK Hub Generation v1.0.0-Generation
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Before opening, please run `python -B -u scripts/preflight_health_check.py --check-only` to verify your local `v1.0.0-Generation` environment.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Invoke skill '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & OS
      description: OS version, Python version, NK_MODEL_PROFILE, and IDE environment.
      placeholder: Windows 11, Python 3.12, NK_MODEL_PROFILE=generation, Google Antigravity 2.0
    validations:
      required: true
