name: 🐛 Bug Report
description: Report a reproducible issue or unexpected behavior in Lab NK Hub
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Before opening, please run `python scripts/preflight_health_check.py` to ensure your local environment is healthy.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Invocate skill '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & OS
      description: OS version, Python version, and execution environment.
      placeholder: Windows 11, Python 3.11/3.14, Google Antigravity / Claude
    validations:
      required: true
