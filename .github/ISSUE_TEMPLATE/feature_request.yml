name: 🚀 Feature Request
description: Suggest a new capability or enhancement for NK Hub Generation v1.0.0-Generation
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new skills, `generation` profile optimizations, or sandboxing improvements in `NK Hub Generation v1.0.0-Generation`.
  - type: textarea
    id: problem-or-need
    attributes:
      label: Problem or Goal
      description: Is your feature request related to a problem or a new workflow?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
    validations:
      required: true
