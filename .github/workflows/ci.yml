name: NK Hub Generation Continuous Verification (v1.0.0-Generation)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      NK_MODEL_PROFILE: "generation"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Configure Git Line Endings
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "nk_docs_and_setup/requirements.txt"

      - name: Install Dependencies
        run: |
          python -B -u -m pip install --upgrade pip pytest-cov
          if [ -f "nk_docs_and_setup/requirements.txt" ]; then
            python -B -u -m pip install -r nk_docs_and_setup/requirements.txt
          elif [ -f "requirements.txt" ]; then
            python -B -u -m pip install -r requirements.txt
          fi

      - name: Initialize Tracked Runtime Directories
        run: |
          mkdir -p .staging nk_tracking/manifests

      - name: Run Pre-Flight Environment Capability Discovery
        run: |
          python -B -u scripts/env_capability_probe.py

      - name: Run Preflight Health Check
        run: |
          python -B -u scripts/preflight_health_check.py --check-only

      - name: Run Fast-Stat Session Bootstrap Gate
        run: |
          python -B -u scripts/nk_session_bootstrap.py --force-full

      - name: Run Deterministic AST Guard Validator
        run: |
          python -B -u scripts/ast_guard_validator.py --target all

      - name: Run O(1) Registry Integrity Verification
        run: |
          python -B -u scripts/nk_registry_indexer.py --verify

      - name: Run Epistemic Oracle Lock Verification
        run: |
          python -B -u scripts/nk_transcript_tools.py oracle-lock verify

      - name: Run Bounded-RSI Strict Ecosystem Verification
        run: |
          python -B -u scripts/rsi_convergence_engine.py --verify --strict-verify --benchmark-suite tests/test_rsi_convergence_engine.py

      - name: Run Core Platform Test Suite with Branch Coverage (v1.0.0-Generation)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -B -u -m pytest tests -p no:cacheprovider --cov=scripts --cov-branch --cov-fail-under=85 -q --junitxml="$RUNNER_TEMP/pytest-results.xml"

      - name: Report Failing Tests Diagnostic
        if: failure()
        shell: pwsh
        run: |
          $xmlPath = Join-Path $env:RUNNER_TEMP "pytest-results.xml"
          if (Test-Path $xmlPath) {
            [xml]$xml = Get-Content $xmlPath
            $failures = $xml.SelectNodes("//testcase[failure or error]")
            foreach ($f in $failures) {
              foreach ($node in $f.SelectNodes("failure | error")) {
                $kind = $node.Name.ToUpperInvariant()
                $msg = $node.GetAttribute("message")
                Write-Host "::error::TEST ${kind}: $($f.classname).$($f.name) -> $msg"
                if ($node.InnerText) {
                  Write-Host $node.InnerText
                }
              }
            }
          }
