name: NK Hub Generation Continuous Verification (v3.0.2-Generation)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      NK_MODEL_PROFILE: "generation"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Configure Git Line Endings
        run: git config --global core.autocrlf false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "nk_docs_and_setup/requirements.txt"

      - name: Install Dependencies
        run: |
          python -B -u -m pip install --upgrade pip pytest-cov
          if [ -f "nk_docs_and_setup/requirements.txt" ]; then
            python -B -u -m pip install -r nk_docs_and_setup/requirements.txt
          elif [ -f "requirements.txt" ]; then
            python -B -u -m pip install -r requirements.txt
          fi

      - name: Initialize Tracked Runtime Directories
        run: |
          mkdir -p .staging nk_tracking/manifests

      - name: Run Pre-Flight Environment Capability Discovery
        run: |
          python -B -u scripts/env_capability_probe.py

      - name: Run Preflight Health Check
        run: |
          python -B -u scripts/preflight_health_check.py --check-only

      - name: Run Fast-Stat Session Bootstrap Gate
        run: |
          python -B -u scripts/nk_session_bootstrap.py --force-full

      - name: Run Deterministic AST Guard Validator
        run: |
          python -B -u scripts/ast_guard_validator.py --target all

      - name: Run O(1) Registry Integrity Verification
        run: |
          python -B -u scripts/nk_registry_indexer.py --verify

      - name: Run Epistemic Oracle Lock Verification
        run: |
          python -B -u scripts/nk_transcript_tools.py oracle-lock verify
          if [ -f "nk_tracking/oracle_lock_holdout.json" ]; then
            python -B -u scripts/nk_transcript_tools.py oracle-lock verify --lock-file nk_tracking/oracle_lock_holdout.json --target nk_tracking/oracle_holdout
          fi
          if [ -f "nk_tracking/governance_lock.json" ]; then
            python -B -u scripts/nk_transcript_tools.py oracle-lock verify --lock-file nk_tracking/governance_lock.json --target scripts
          fi
          if [ -f "nk_tracking/tensor_rsi_lock.json" ]; then
            python -B -u scripts/nk_transcript_tools.py oracle-lock verify --lock-file nk_tracking/tensor_rsi_lock.json --target nk_genome/configs/tensor_rsi
          fi

      - name: Run Tier 1 Fast Gate (-m fast <= 8.0s)
        run: |
          JUNIT_XML="${RUNNER_TEMP//\\//}/pytest-results.xml"
          python -B -u scripts/platform_runner.py --pytest-isolated --overlay-staging --workspace-root . --pytest-args "-m fast -q --junitxml=\"${JUNIT_XML}\"" --json > "${RUNNER_TEMP}/tier1_fast.json"
          python -B -c "import json, os, sys; d = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'tier1_fast.json'), encoding='utf-8')); dur = float(d.get('duration_s', 999.0)); print(f'[TIER-1] status={d.get(\"status\")} passed={d.get(\"passed\")} duration_s={dur}'); sys.exit(0 if d.get('exit_code') == 0 and dur <= 8.0 else 1)"

      - name: Run Full T1+T2 Gate (<= 28.0s) & Branch Coverage (>= 88.0% / >= 82.0%)
        run: |
          JUNIT_XML="${RUNNER_TEMP//\\//}/pytest-results.xml"
          python -B -u scripts/platform_runner.py --pytest-isolated --overlay-staging --workspace-root . --pytest-args "-m \"not stress\" -q --junitxml=\"${JUNIT_XML}\"" --json > "${RUNNER_TEMP}/t1_t2_clean.json"
          python -B -c "import json, os, sys; d = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 't1_t2_clean.json'), encoding='utf-8')); dur = float(d.get('duration_s', 999.0)); print(f'[T1+T2 CLEAN] status={d.get(\"status\")} passed={d.get(\"passed\")} duration_s={dur}'); sys.exit(0 if d.get('exit_code') == 0 and dur <= 28.0 else 1)"
          python -B -u scripts/platform_runner.py --pytest-isolated --overlay-staging --workspace-root . --coverage --pytest-args "-m \"not stress\" -q --junitxml=\"${JUNIT_XML}\"" --json > "${RUNNER_TEMP}/t1_t2_cov.json"
          python -B -c "import json, os, sys; d = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 't1_t2_cov.json'), encoding='utf-8')); c = d.get('coverage', {}); comb = float(c.get('combined_coverage_pct', 0.0)); br = float(c.get('true_branch_coverage_pct', 0.0)); print(f'[T1+T2 COV] status={d.get(\"status\")} combined={comb}% true_branch={br}%'); sys.exit(0 if d.get('exit_code') == 0 and comb >= 88.0 and br >= 82.0 else 1)"

      - name: Run Bounded-RSI Strict Ecosystem Verification
        run: |
          python -B -u scripts/rsi_convergence_engine.py --verify --strict-verify --diff-aware --benchmark-suite tests/test_rsi_convergence_engine.py

      - name: Report Failing Tests Diagnostic
        if: failure()
        shell: pwsh
        run: |
          $xmlPath = Join-Path $env:RUNNER_TEMP "pytest-results.xml"
          if (Test-Path $xmlPath) {
            [xml]$xml = Get-Content $xmlPath
            $failures = $xml.SelectNodes("//testcase[failure or error]")
            foreach ($f in $failures) {
              foreach ($node in $f.SelectNodes("failure | error")) {
                $kind = $node.Name.ToUpperInvariant()
                $msg = $node.GetAttribute("message")
                Write-Host "::error::TEST ${kind}: $($f.classname).$($f.name) -> $msg"
                if ($node.InnerText) {
                  Write-Host $node.InnerText
                }
              }
            }
          }
