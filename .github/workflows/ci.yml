name: Lab NK Hub Continuous Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pre-Flight Environment Capability Discovery
        run: |
          python scripts/env_capability_probe.py

      - name: Run Preflight Health Check
        run: |
          python scripts/preflight_health_check.py

      - name: Run Deterministic AST Guard Validator
        run: |
          python scripts/ast_guard_validator.py --target all

      - name: Run Core Platform Test Suite (60 Permanent Tests)
        run: |
          pip install pytest-github-actions-annotate-failures
          python -m pytest tests/ -v --tb=short --junitxml=pytest-results.xml

      - name: Report Failing Tests Diagnostic
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path pytest-results.xml) {
            [xml]$xml = Get-Content pytest-results.xml
            $failures = $xml.SelectNodes("//testcase[failure or error]")
            foreach ($f in $failures) {
              Write-Host "::error::TEST FAILED: $($f.classname).$($f.name) -> $($f.failure.message)"
              Write-Host $f.failure.'#text'
            }
          }

