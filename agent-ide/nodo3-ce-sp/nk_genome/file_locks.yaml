# File protetti - Il Costruttore NON può sovrascrivere questi file.
# Può solo fare modifiche incrementali (append/replace chirurgico).

locked_files:
  - path: src_app/app.js
    min_size_kb: 70
    operation: append_only
    
  - path: src_app/index.html
    min_size_kb: 30
    operation: append_only
    
  - path: src_app/styles.css
    min_size_kb: 25
    operation: append_only

  - path: src_app/backend/ingestion_parser_service.py
    min_size_kb: 20
    operation: append_only

# Regola: dopo ogni modifica, verificare che le dimensioni
# non siano scese sotto il minimo. Se lo sono, ROLLBACK immediato.
