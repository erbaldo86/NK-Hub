[pytest]
testpaths = tests
addopts = --tb=short -p no:cacheprovider
norecursedirs = .staging temp* .git __pycache__ nk_tracking nk_genome .agents nk_docs_and_setup .pytest_cache
markers =
    fast: Pure in-process unit and gate tests without child subprocesses, git CLI, DAST watchdog, or live sockets.
    integration: Tests spawning Python or git subprocesses, DAST sandbox watchdogs, TCP sockets, or multi-thread stress.
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore::DeprecationWarning:starlette.testclient
    ignore::UserWarning:fastapi.testclient
    ignore::UserWarning:starlette.testclient
